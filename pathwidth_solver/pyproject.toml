[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathwidth"
version = "0.1.0"
description = "Exact pathwidth of graphs by customer search (Chu & Stuckey 2009 ported from MOSP)"
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["pathwidth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
